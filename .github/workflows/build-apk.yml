name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ "README.md", "HOW-TO-INSTALL-ON-PHONE.md" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Copy website files into the app
        run: npm run build:web
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}

      - name: Create the Android project
        run: npx cap add android

      - name: Add icons, permissions and Firebase config
        run: node scripts/prepare-android.js

      - name: Sync web files and plugins into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: Asaumi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
